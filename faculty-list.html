<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Faculty List</title>
  <link rel="stylesheet" href="faculty-list.css">
</head>
<body>
  <div class="faculty-container">
    <h2>Faculty Details</h2>

    
    <div class="search-section">
      <div class="search-labels">
        <span>Name</span>
        <span>Department</span>
        <span>Course Taught</span>
        <span>Area of Expertise</span>
      </div>
      <div class="search-bars">
        <input type="text" placeholder="Search by name">
        <input type="text" placeholder="Search by department">
        <input type="text" placeholder="Search by course">
        <input type="text" placeholder="Search by expertise">
      </div>
    </div>

  
    <table class="faculty-table">
      <thead>
        <tr>
          <th>Name</th>
          <th>Department</th>
          <th>Courses Taught</th>
          <th>Expertise</th>
          <th>Interests</th>
          <th>Email</th>
          <th>Action</th>
        </tr>
      </thead>
     <tbody>
  <!-- Faculty data will be rendered dynamically -->
</tbody>

    </table>

    
  </div>
  <script src="faculty-list.js"></script>
</body>
</html>
