<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Faculty List</title>

  <!-- Common styles for header & footer -->
  <link rel="stylesheet" href="../css/common.css" />

  <!-- Page-specific styles -->
  <link rel="stylesheet" href="../css/faculty-list.css" />
  <link rel="stylesheet" href="../css/admin-dashboard.css" />
</head>
<body>
  <!-- Header (loaded dynamically) -->
  <div id="header"></div>

  <!-- Main Content -->
  <main class="main-content">
    <div class="faculty-container">
      <div class="directory-header">
        <div>
          <h2>Faculty Directory</h2>
          <p class="directory-subtitle">Search, discover, and connect with academic faculty members across all departments</p>
        </div>
        <div class="header-actions">
          <div class="view-toggle">
            <button type="button" class="btn-toggle active" id="viewGridBtn" title="Grid View">
              <span class="toggle-icon">🎴</span> Grid
            </button>
            <button type="button" class="btn-toggle" id="viewTableBtn" title="Table View">
              <span class="toggle-icon">📑</span> Table
            </button>
          </div>
          <div class="add-btn-container admin-only">
            <button class="btn-add" onclick="window.location.href='add-faculty.html'">
              <span>➕</span> Add Faculty
            </button>
          </div>
        </div>
      </div>

      <div class="search-section">
        <div class="search-grid">
          <div class="search-field">
            <label for="searchName">Name</label>
            <div class="input-icon-wrapper">
              <span class="field-icon">🔍</span>
              <input type="text" id="searchName" placeholder="Search by name..." />
            </div>
          </div>
          <div class="search-field">
            <label for="searchDept">Department</label>
            <div class="input-icon-wrapper">
              <span class="field-icon">🏢</span>
              <input type="text" id="searchDept" placeholder="Search by department..." />
            </div>
          </div>
          <div class="search-field">
            <label for="searchCourse">Course Taught</label>
            <div class="input-icon-wrapper">
              <span class="field-icon">📚</span>
              <input type="text" id="searchCourse" placeholder="Search by course..." />
            </div>
          </div>
          <div class="search-field">
            <label for="searchExpertise">Area of Expertise</label>
            <div class="input-icon-wrapper">
              <span class="field-icon">💡</span>
              <input type="text" id="searchExpertise" placeholder="Search by expertise..." />
            </div>
          </div>
          <div class="search-field">
            <label for="searchInterests">Professional Interests</label>
            <div class="input-icon-wrapper">
              <span class="field-icon">🌟</span>
              <input type="text" id="searchInterests" placeholder="Search by interests..." />
            </div>
          </div>
        </div>
      </div>

      <!-- Card Grid Container (Default View) -->
      <div class="faculty-grid" id="facultyGrid">
        <!-- Faculty cards rendered dynamically -->
      </div>

      <!-- Table View (Alternative) -->
      <div class="table-responsive" id="tableContainer" style="display: none;">
        <table class="faculty-table" id="facultyTable">
          <thead>
            <tr>
              <th>Profile</th>
              <th>Name</th>
              <th>Department</th>
              <th>Courses Taught</th>
              <th>Expertise</th>
              <th>Interests</th>
              <th>Email</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody>
            <!-- Faculty data rendered dynamically -->
          </tbody>
        </table>
      </div>

      <div id="paginationContainer" class="pagination"></div>
    </div>
  </main>

  <!-- Delete Confirmation Modal -->
  <div class="delete-modal" id="deleteModal">
    <div class="delete-modal-content">
      <h3>Confirm Deletion</h3>
      <p>Are you sure you want to delete this faculty member?</p>
      <div class="modal-buttons">
        <button type="button" class="btn-cancel-delete">Cancel</button>
        <button type="button" class="btn-confirm-delete">Delete</button>
      </div>
    </div>
  </div>

  <!-- Footer (loaded dynamically) -->
  <div id="footer"></div>

  <!-- Script to load header & footer -->
  <script>
    async function includeHTML(id, file) {
      const res = await fetch(file);
      const html = await res.text();
      document.getElementById(id).innerHTML = html;
    }

    async function initLayout() {
      await includeHTML("header", "header.html");
      await includeHTML("footer", "footer.html");

      // Define logout globally
      window.logout = function() {
        localStorage.removeItem('role');
        window.location.href = '../index.html';
      };

      // Role-based visibility & Header Badges
      const role = localStorage.getItem('role');
      const isAdmin = role === 'admin';

      if (!isAdmin) {
        document.querySelectorAll('.admin-only').forEach(el => el.style.display = 'none');
      }

      const roleTextDisplay = document.getElementById('roleTextDisplay');
      const roleIconDisplay = document.getElementById('roleIconDisplay');
      const sidebarUserTitle = document.getElementById('sidebarUserTitle');
      const sidebarUserStatus = document.getElementById('sidebarUserStatus');

      if (roleTextDisplay) roleTextDisplay.textContent = isAdmin ? 'Administrator' : 'Guest Visitor';
      if (roleIconDisplay) roleIconDisplay.textContent = isAdmin ? '⚡' : '👤';
      if (sidebarUserTitle) sidebarUserTitle.textContent = isAdmin ? 'Admin Account' : 'Guest Visitor';
      if (sidebarUserStatus) sidebarUserStatus.textContent = isAdmin ? 'Full Control' : 'Read-Only';

      // Init Sidebar Toggle
      const toggleBtn = document.getElementById("sidebarToggle");
      if (toggleBtn) {
        toggleBtn.addEventListener("click", () => {
          document.body.classList.toggle("sidebar-closed");
        });
      }

      // Highlight active page
      const navLinks = document.querySelectorAll('.sidebar-nav a');
      const currentPath = window.location.pathname;
      let currentFile = currentPath.split('/').pop();
      if (!currentFile) currentFile = 'index.html';

      navLinks.forEach(link => {
        if(link.getAttribute('href') === currentFile) {
          link.classList.add('active-page');
        }
      });
    }

    initLayout();
  </script>

  <!-- Scripts -->
  <script src="../js/faculty-list.js"></script>
  <script src="../js/toast.js"></script>
  </body>
</html>
