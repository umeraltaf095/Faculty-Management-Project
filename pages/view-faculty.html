<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>View Faculty</title>
    <link rel="stylesheet" href="../css/common.css" />
    <link rel="stylesheet" href="../css/admin-dashboard.css" />
    <style>
      .add-faculty-form-container {
        background: white;
        padding: 30px;
        border-radius: 8px;
        max-width: 600px;
        margin: 40px auto;
        box-shadow: 0 0 15px rgba(0,0,0,0.1);
      }
      .add-faculty-form-container h2 {
        text-align: center;
        margin-bottom: 25px;
        font-size: 24px;
        color: #333;
      }
      #viewFacultyForm {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 15px;
      }
      .form-group {
        margin-bottom: 0;
      }
      .form-group label {
        display: block;
        font-weight: bold;
        margin-bottom: 5px;
        color: #555;
      }
      .data-value {
        width: 100%;
        padding: 10px 0;
        font-size: 15px;
        color: #333;
        border-bottom: 1px solid #eee;
        word-break: break-word;
      }
      .form-actions {
        grid-column: span 2;
        display: flex;
        justify-content: center;
        margin-top: 20px;
      }
      .btn-cancel {
        padding: 10px 30px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-size: 16px;
        transition: background 0.3s;
        background: #3498db;
        color: white;
      }
      .btn-cancel:hover {
        background: #2c80b4;
      }
    </style>
  </head>

  <body>
    <!-- Header (loaded dynamically) -->
    <div id="header"></div>

    <!-- Main Content -->
    <main class="main-content">
      <div class="add-faculty-form-container">
        <h2> Faculty Details</h2>
        <form id="viewFacultyForm">
          <div class="form-group" style="grid-column: span 2; text-align: center;">
            <div id="view-image-container" style="margin-bottom: 20px;">
                <!-- Image will be displayed here -->
            </div>
          </div>
          <div class="form-group">
            <label>Name</label>
            <div class="data-value" id="view-name"></div>
          </div>
          <div class="form-group">
            <label>Department</label>
            <div class="data-value" id="view-department"></div>
          </div>
          <div class="form-group">
            <label>Courses Taught</label>
            <div class="data-value" id="view-courses_taught"></div>
          </div>
          <div class="form-group">
            <label>Area of Expertise</label>
            <div class="data-value" id="view-expertise"></div>
          </div>
          <div class="form-group">
            <label>Interests</label>
            <div class="data-value" id="view-interests"></div>
          </div>
          <div class="form-group">
            <label>Email</label>
            <div class="data-value" id="view-contact"></div>
          </div>

          <div class="form-actions">
            <button type="button" class="btn-cancel" onclick="goBack()">Close</button>
          </div>
        </form>
      </div>
    </main>

    <!-- Footer (loaded dynamically) -->
    <div id="footer"></div>

    <!-- Load header & footer dynamically -->
    <script>
      async function includeHTML(id, file) {
        const res = await fetch(file);
        const html = await res.text();
        document.getElementById(id).innerHTML = html;
      }

      async function initLayout() {
        await includeHTML("header", "header.html");
        await includeHTML("footer", "footer.html");

        // Define logout globally
        window.logout = function() {
          localStorage.removeItem('role');
          window.location.href = '../index.html';
        };

        // Role-based visibility
        const role = localStorage.getItem('role');
        if (role !== 'admin') {
          document.querySelectorAll('.admin-only').forEach(el => el.style.display = 'none');
        }

        // Init Sidebar Toggle
        const toggleBtn = document.getElementById("sidebarToggle");
        const sidebar = document.getElementById("sidebar");
        if (toggleBtn && sidebar) {
            toggleBtn.addEventListener("click", () => {
                sidebar.classList.toggle("sidebar-closed");
                document.body.classList.toggle("sidebar-closed");
            });
        }
      }

      function goBack() {
        // Return to the previous page (admin dashboard or faculty list)
        window.history.back();
      }

      initLayout();
    </script>
    <script src="../js/view-faculty.js"></script>
    <script src="../js/toast.js"></script>
  </body>
</html>
