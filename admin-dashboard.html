<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Faculty List</title>
    <link rel="stylesheet" href="common.css" />
    <link rel="stylesheet" href="admin-dashboard.css" />
  </head>

  <body>
    <!-- Header (loaded dynamically) -->
    <div id="header"></div>

    <!-- Main Content -->
    <main class="main-content">
      <div class="faculty-container">
        <h2>Faculty Details</h2>

        <div class="search-section">
          <div class="search-labels">
            <span>Name</span>
            <span>Department</span>
            <span>Course Taught</span>
            <span>Area of Expertise</span>
          </div>

          <div class="search-bars">
            <input type="text" placeholder="Search by name" />
            <input type="text" placeholder="Search by department" />
            <input type="text" placeholder="Search by course" />
            <input type="text" placeholder="Search by expertise" />
          </div>

          <div class="add-btn-container">
            <button class="btn-add" onclick="window.location.href='add-faculty.html'">Add</button>
          </div>
        </div>

        <!-- Table Section -->
        <table class="faculty-table">
          <thead>
            <tr>
              <th>Profile</th>
              <th>Name</th>
              <th>Department</th>
              <th>Courses Taught</th>
              <th>Expertise</th>
              <th>Interests</th>
              <th>Email</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody>
            <!-- Faculty data will be rendered dynamically -->
          </tbody>
        </table>
        <div id="paginationContainer" class="pagination"></div>
      </div>
    </main>



    <!-- Delete Confirmation Modal -->
    <div class="delete-modal" id="deleteModal">
      <div class="delete-modal-content">
        <h3>Confirm Deletion</h3>
        <p>Are you sure you want to delete this faculty member?</p>
        <div class="modal-buttons">
          <button type="button" class="btn-cancel-delete">Cancel</button>
          <button type="button" class="btn-confirm-delete">Delete</button>
        </div>
      </div>
    </div>





    <!-- Footer (loaded dynamically) -->
    <div id="footer"></div>

    <!-- Load header & footer dynamically -->
    <script>
      async function includeHTML(id, file) {
        const res = await fetch(file);
        const html = await res.text();
        document.getElementById(id).innerHTML = html;
      }

      async function initLayout() {
        await includeHTML("header", "header.html");
        await includeHTML("footer", "footer.html");

        // Init Sidebar Toggle
        const toggleBtn = document.getElementById("sidebarToggle");
        const sidebar = document.getElementById("sidebar");
        if (toggleBtn && sidebar) {
            toggleBtn.addEventListener("click", () => {
                sidebar.classList.toggle("sidebar-closed");
                document.body.classList.toggle("sidebar-closed");
            });
        }

        // Highlight active page
        const navLinks = document.querySelectorAll('.sidebar-nav a');
        const currentPath = window.location.pathname;
        let currentFile = currentPath.split('/').pop();
        if (!currentFile) currentFile = 'index.html';

        navLinks.forEach(link => {
            if(link.getAttribute('href') === currentFile) {
                link.classList.add('active-page');
            }
        });
      }

      initLayout();
    </script>

    <script src="faculty-list.js"></script>
    <script src="admin-dashboard.js"></script>
  </body>
</html>
